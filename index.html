<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6fa8b5">
<title>اختبار القانون التجاري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f4f7f6;--card:#ffffff;--ink:#2c3e48;--mut:#7a8b94;--line:#e3eaea;
--pri:#5a9a9c;--pri2:#7db5b0;--priS:#e8f2f1;--head1:#6fa8b5;--head2:#85bdb3;
--ok:#4f9d7b;--okbg:#e6f4ee;--bad:#c9716f;--badbg:#faeceb;--chipOn:#4f8f93;--shadow:0 10px 30px rgba(70,110,120,.12);--btnTxt:#fff}
[data-theme=dark]{
--bg:#131b21;--card:#1b252c;--ink:#e2eaee;--mut:#8fa1ab;--line:#2a3740;
--pri:#7fb8b3;--pri2:#5f9c9a;--priS:#243540;--head1:#1f3b4a;--head2:#23474f;
--ok:#6cc29c;--okbg:#1b3329;--bad:#e08a88;--badbg:#3a2527;--chipOn:#5f9c9a;--shadow:0 10px 30px rgba(0,0,0,.35);--btnTxt:#0f1a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{transition:background .3s}
body{margin:0;font-family:'IBM Plex Sans Arabic','Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.8;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:20px 16px 76px;position:relative;overflow:hidden;transition:background .3s}
.top:before,.top:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.top:before{width:200px;height:200px;left:-60px;top:-80px}
.top:after{width:140px;height:140px;right:20%;bottom:-70px}
.brand{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);display:grid;place-items:center;font-size:24px}
.brand .t{flex:1}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
.brand small{color:rgba(255,255,255,.85);font-weight:400;display:block;font-size:13px}
.theme{flex:none;width:68px;height:34px;border-radius:99px;border:0;background:rgba(255,255,255,.22);position:relative;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:16px;line-height:1}
.theme .knob{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s;display:grid;place-items:center;font-size:16px}
[data-theme=dark] .theme .knob{transform:translateX(-34px);background:#dfe9f0}
.theme span{opacity:.75;z-index:0}
main{max-width:760px;margin:-56px auto 0;padding:0 14px 40px;position:relative;z-index:2}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:24px;border:1px solid var(--line);transition:background .3s,border-color .3s}
.hide{display:none!important}
h2{margin:0 0 6px;font-size:22px;color:var(--ink);font-weight:700}
p.sub{margin:0 0 18px;color:var(--mut);font-size:15px}
.label{font-weight:600;margin:18px 0 9px;font-size:15px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 18px;font:inherit;font-weight:500;font-size:15px;cursor:pointer;color:var(--ink);transition:.2s}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--chipOn);color:#fff;border-color:var(--chipOn)}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 0 0;border-top:1px dashed var(--line);margin-top:18px;font-weight:500;font-size:15px}
.switch input{width:44px;height:24px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch input:after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--pri)}
.switch input:checked:after{right:23px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:16.5px;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--btnTxt);margin-top:20px;box-shadow:0 6px 16px rgba(90,154,156,.28);transition:.15s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none;margin-top:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:var(--priS);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:21px;color:var(--pri);font-weight:700}
.stat span{font-size:12.5px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.prog{flex:1;height:8px;background:var(--priS);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri2),var(--pri));border-radius:99px;transition:width .3s}
.cnt{font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.tm{font-weight:600;color:var(--pri);background:var(--priS);padding:2px 11px;border-radius:99px;font-size:14px;font-variant-numeric:tabular-nums}
.tm.low{background:var(--badbg);color:var(--bad)}
.q{font-size:19px;font-weight:600;line-height:1.95;color:var(--ink);margin:4px 0 18px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;background:transparent;border:1.6px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);transition:.18s}
.opt:hover:not(:disabled){border-color:var(--pri);background:var(--priS)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:var(--priS);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.opt.no .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fb{margin-top:6px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14.5px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}
.nav{display:flex;gap:10px}
.nav .btn{margin-top:16px}
.ring{width:150px;height:150px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--priS) 0)}
.ring div{width:124px;height:124px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--pri)}
.center{text-align:center}
.rev{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.rev h4{margin:0 0 8px;font-size:15px;color:var(--ink);line-height:1.9;font-weight:600}
.rev .a{font-size:14px;padding:6px 10px;border-radius:9px;margin-top:5px}
.rev .a.ok{background:var(--okbg);color:var(--ok)}.rev .a.no{background:var(--badbg);color:var(--bad)}
footer{text-align:center;color:var(--mut);font-size:13.5px;margin-top:24px}
footer b{color:var(--pri);font-weight:600}
@media(min-width:600px){.top{padding-top:28px}.card{padding:32px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">⚖</div><div class="t"><h1>اختبار القانون التجاري</h1><small>بنك أسئلة MCQ · <span id="total"></span> سؤالاً</small></div><button class="theme" id="theme" aria-label="تبديل الوضع الليلي والنهاري"><span>☀️</span><span>🌙</span><i class="knob" id="knob" style="font-style:normal">☀️</i></button></div></header>
<main>
<section class="card" id="home">
  <h2>مرحباً بك 👋</h2>
  <p class="sub">اختر إعدادات الاختبار ثم ابدأ. تُخلط الأسئلة والخيارات في كل محاولة.</p>
  <div class="label">عدد الأسئلة</div>
  <div class="chips" id="nChips"></div>
  <div class="label">وضع الاختبار</div>
  <div class="chips" id="mChips">
    <button class="chip on" data-m="learn">تدريب (إجابة فورية)</button>
    <button class="chip" data-m="exam">امتحان (النتيجة في النهاية)</button>
  </div>
  <label class="switch">مؤقّت (30 ثانية لكل سؤال)<input type="checkbox" id="timerOn"></label>
  <div class="stats">
    <div class="stat"><b id="sBest">—</b><span>أفضل نتيجة</span></div>
    <div class="stat"><b id="sRuns">0</b><span>محاولات</span></div>
    <div class="stat"><b id="sLast">—</b><span>آخر نتيجة</span></div>
  </div>
  <button class="btn" id="start">ابدأ الاختبار</button>
  <button class="btn sec hide" id="retryWrong">أعد الأسئلة التي أخطأت بها سابقاً</button>
</section>

<section class="card hide" id="quiz">
  <div class="bar"><span class="cnt" id="cnt"></span><div class="prog"><i id="pg"></i></div><span class="tm hide" id="tm"></span></div>
  <div class="q" id="qt"></div>
  <div id="opts"></div>
  <div id="fb"></div>
  <div class="nav"><button class="btn" id="next" disabled>التالي</button></div>
  <button class="btn sec" id="quit">إنهاء الاختبار</button>
</section>

<section class="card hide" id="res">
  <div class="center">
    <div class="ring" id="ring"><div id="pct"></div></div>
    <h2 id="verdict"></h2>
    <p class="sub" id="detail"></p>
  </div>
  <button class="btn" id="again">اختبار جديد</button>
  <button class="btn sec" id="toggleRev">مراجعة الإجابات</button>
  <div id="review" class="hide"></div>
</section>
<footer>تصميم: <b>عبد الله مصطفى</b> · مادة القانون التجاري</footer>
</main>
<script>
const BANK=[{"q": "ما هو الأساس في نشأة علم القانون كما يرى جانب كبير من الفقه؟", "a": "الحق والمطالبة به", "w": ["السلطة العامة", "العرف التجاري", "الجزاء القانوني"]}, {"q": "كيف عرفت النظرية الحديثة \"الحق\"؟", "a": "استئثار شخص بقيمة معينة طبقاً للقانون", "w": ["رابطة مادية بين دائن ومدين", "سلطة يمنحها القانون للنائب لإدارة أموال غيره", "مجموعة قواعد ملزمة تنظم السلوك"]}, {"q": "من الأمثلة على الحقوق العينية الواردة في النص:", "a": "حق الملكية", "w": ["عقد العمل", "حق المؤلف على كتابه", "براءة الاختراع للمخترع"]}, {"q": "أي من الحقوق التالية يعد من الحقوق الذهنية (الفكرية)؟", "a": "حق المؤلف على كتابه أو المخترع على براءة اختراعه", "w": ["علاقة المديونية بين دائن ومدين", "حق الملكية العقارية", "حق الانتفاع بالعقار"]}, {"q": "ما هي الحالة التي تولدها الحقوق بين طرفي العقد (كالبيع)؟", "a": "الالتزام", "w": ["السلطة التقديرية", "النفاذ المعجل", "الإفلاس"]}, {"q": "يعرف الالتزام بأنه حالة قانونية يرتبط بمقتضاها شخص معين بـ:", "a": "نقل حق عيني أو القيام بعمل أو الامتناع عن عمل", "w": ["ممارسة التجارة باسمه ولحسابه", "فرض سلطته على أموال غيره", "تطبيق الجزاء على المخالفين"]}, {"q": "ما هو الفرق الجوهري بين الحق والسلطة؟", "a": "الحق ينطوي على سلطة، وقد توجد السلطة دون حق كسلطة الوكيل", "w": ["الحق لا يتضمن سلطة إطلاقاً", "السلطة لا توجد إلا بوجود حق", "الحق والسلطة مفهومان متطابقان تماماً"]}, {"q": "يعتبر التزام بايع العقار بنقل ملكيته للمشتري مثالاً على:", "a": "التزام بإعطاء شيء (نقل حق عيني)", "w": ["التزام بالامتناع عن عمل", "التزام بعمل إيجابي محض", "التزام بحرفة مدنية"]}, {"q": "الاتفاق على عدم المنافسة في التجارة يعد مثالاً على:", "a": "التزام بالامتناع عن عمل", "w": ["التزام بإعطاء شيء", "التزام بنقل حق عيني", "التزام عمل إيجابي"]}, {"q": "يقصد بالشخص المعنوي في القانون:", "a": "الشركات والجمعيات والمؤسسات التي تدخل التعاملات القانونية بصفة شخص", "w": ["الفرد الطبيعي الذي يتمتع بالأهلية", "التاجر الذي يحترف العمل التجاري بمفرده", "القاضي الذي يصدر الأحكام"]}, {"q": "مدرسة القانون العام تعرف أيضاً باسم:", "a": "المدرسة الأنكلوسكسونية (الأنجلوفونية)", "w": ["ال function home(){

  $('sLast').textContent=h.length?h[h.length-1]+'%':'—';

function show(id){['home','quiz','res'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo({top:0,behavior:'smooth'})}
function begin(idxs){
  const items=shuffle(idxs).map(i=>{const q=BANK[i];const opts=shuffle([{t:q.a,c:true},...q.w.map(t=>({t,c:false}))]);return{i,q:q.q,opts,pick:null}});

}
function render(){
  clearInterval(timer);
  const it=S.items[S.cur],n=S.items.length;
  $('cnt').textContent=`${S.cur+1} / ${n}`;
  $('pg').style.width=(S.cur/n*100)+'%';
  $('qt').textContent=it.q;
  $('fb').innerHTML='';
  $('opts').innerHTML=it.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${K[j]}</span><span>${o.t}</span></button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  $('next').disabled=true;
  $('next').textContent=S.cur===n-1?'عرض النتيجة':'التالي';
  const tm=$('tm');tm.classList.toggle('hide',!S.timed);
  if(S.timed){let t=30;const tick=()=>{tm.textContent='⏱ '+t;tm.classList.toggle('low',t<=8);if(t--<=0){clearInterval(timer);if(it.pick===null)pick(-1)}};tick();timer=setInterval(tick,1000)}
}
function pick(j){
  const it=S.items[S.cur];if(it.pick!==null)return;
  it.pick=j;clearInterval(timer);
  const btns=[...document.querySelectorAll('.opt')];
  if(S.mode==='learn'){
    btns.forEach((b,k)=>{b.disabled=true;if(it.opts[k].c)b.classList.add('ok');else if(k===j)b.classList.add('no');else b.classList.add('dim')});
    const ok=j>=0&&it.opts[j].c;
    $('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${j<0?'انتهى الوقت ⏱':ok?'إجابة صحيحة ✓':'إجابة خاطئة ✗'}</div>`;
  }else{
    btns.forEach((b,k)=>{b.disabled=true;if(k===j)b.classList.add('ok');else b.classList.add('dim')});
  }
  $('next').disabled=false;
}
$('next').onclick=()=>{if(S.cur<S.items.length-1){S.cur++;render()}else finish()};
$('quit').onclick=()=>{if(confirm('إنهاء الاختبار وعرض النتيجة؟'))finish()};
function finish(){
  clearInterval(timer);
  const answered=S.items.filter(x=>x.pick!==null);
  const items=S.items;
  const right=items.filter(x=>x.pick!==null&&x.pick>=0&&x.opts[x.pick].c).length;
  const pct=Math.round(right/items.length*100);
  const h=store.get('hist',[]);h.push(pct);store.set('hist',h.slice(-50));
  const wrong=new Set(store.get('wrong',[]));
  items.forEach(x=>{const ok=x.pick!==null&&x.pick>=0&&x.opts[x.pick].c;if(ok)wrong.delete(x.i);else if(x.pick!==null)wrong.add(x.i)});
  store.set('wrong',[...wrong]);
  $('ring').style.setProperty('--p',pct);
  $('pct').textContent=pct+'%';
  $('verdict').textContent=pct>=90?'ممتاز! 🏆':pct>=75?'جيد جداً 👏':pct>=60?'جيد، واصل التدريب 💪':'تحتاج إلى مراجعة 📚';
  $('detail').textContent=`أجبت صحيحاً على ${right} من ${items.length} سؤالاً`+(answered.length<items.length?` (لم تُجب على ${items.length-answered.length})`:'');
  $('review').innerHTML=items.map((x,n)=>{
    const ok=x.pick!==null&&x.pick>=0&&x.opts[x.pick].c;
    const corr=x.opts.find(o=>o.c).t;
    return `<div class="rev"><h4>${n+1}. ${x.q}</h4>`+
      (ok?`<div class="a ok">✓ ${corr}</div>`:
      `<div class="a no">✗ إجابتك: ${x.pick!==null&&x.pick>=0?x.opts[x.pick].t:'بدون إجابة'}</div><div class="a ok">✓ الصحيح: ${corr}</div>`)+`</div>`}).join('');
  $('review').classList.add('hide');$('toggleRev').textContent='مراجعة الإجابات';
  show('res');
}
$('toggleRev').onclick=()=>{const r=$('review');r.classList.toggle('hide');$('toggleRev').textContent=r.classList.contains('hide')?'مراجعة الإجابات':'إخفاء المراجعة'};
$('again').onclick=home;
$('start').onclick=()=>begin(shuffle(BANK.map((_,i)=>i)).slice(0,Math.min(cfg.n,BANK.length)));
$('retryWrong').onclick=()=>{const w=store.get('wrong',[]).filter(i=>i<BANK.length);if(w.length)begin(w)};
function setTheme(m){document.documentElement.dataset.theme=m;$('knob').textContent=m==='dark'?'🌙':'☀️';document.querySelector('meta[name=theme-color]').content=m==='dark'?'#1f3b4a':'#6fa8b5';store.set('theme',m)}
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(store.get('theme','light'));
home();
</script>
</body>
</html>
